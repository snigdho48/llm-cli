name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 1.0.2)"
        required: true
        default: "1.0.2"
      prerelease:
        description: "Mark GitHub Release as prerelease"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".Trim().TrimStart('v')
          }
          else {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v?\d+\.\d+\.\d+') {
              throw "Tag must look like v1.0.2 (got: $tag)"
            }
            $version = $tag.TrimStart('v')
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved version=$version tag=v$version"

      - name: Build + package (x64, x86, arm64)
        shell: pwsh
        run: ./scripts/release.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm-cli-${{ steps.ver.outputs.version }}-windows
          path: |
            artifacts/release/llm-*.exe
            artifacts/release/llm-*.exe.sha256
            artifacts/release/llm-cli-*.zip
            artifacts/release/llm-cli-*.zip.sha256
            packaging/winget/manifest/
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: LLM CLI ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          generate_release_notes: true
          body: |
            ## LLM CLI ${{ steps.ver.outputs.tag }}

            Self-contained Windows builds — **no separate .NET install required**.

            | CPU | Download EXE | Download ZIP |
            |-----|--------------|--------------|
            | **64-bit (x64)** most PCs | `llm-${{ steps.ver.outputs.version }}-win-x64.exe` | `llm-cli-${{ steps.ver.outputs.version }}-win-x64.zip` |
            | **32-bit (x86)** | `llm-${{ steps.ver.outputs.version }}-win-x86.exe` | `llm-cli-${{ steps.ver.outputs.version }}-win-x86.zip` |
            | **ARM64** (Snapdragon / Copilot+ PCs) | `llm-${{ steps.ver.outputs.version }}-win-arm64.exe` | `llm-cli-${{ steps.ver.outputs.version }}-win-arm64.zip` |

            ### Install

            **Single EXE:** download the matching `llm-*-win-*.exe`, rename to `llm.exe`, put on PATH.

            **Zip:**

            ```powershell
            Expand-Archive llm-cli-${{ steps.ver.outputs.version }}-win-x64.zip -DestinationPath .\llm-cli
            cd .\llm-cli
            .\install.ps1
            llm --help
            ```

            ### Winget

            Multi-arch manifests for `Snigdho48.LLMCLI` are attached.
          files: |
            artifacts/release/llm-${{ steps.ver.outputs.version }}-win-x64.exe
            artifacts/release/llm-${{ steps.ver.outputs.version }}-win-x64.exe.sha256
            artifacts/release/llm-${{ steps.ver.outputs.version }}-win-x86.exe
            artifacts/release/llm-${{ steps.ver.outputs.version }}-win-x86.exe.sha256
            artifacts/release/llm-${{ steps.ver.outputs.version }}-win-arm64.exe
            artifacts/release/llm-${{ steps.ver.outputs.version }}-win-arm64.exe.sha256
            artifacts/release/llm-cli-${{ steps.ver.outputs.version }}-win-x64.zip
            artifacts/release/llm-cli-${{ steps.ver.outputs.version }}-win-x64.zip.sha256
            artifacts/release/llm-cli-${{ steps.ver.outputs.version }}-win-x86.zip
            artifacts/release/llm-cli-${{ steps.ver.outputs.version }}-win-x86.zip.sha256
            artifacts/release/llm-cli-${{ steps.ver.outputs.version }}-win-arm64.zip
            artifacts/release/llm-cli-${{ steps.ver.outputs.version }}-win-arm64.zip.sha256
            packaging/winget/manifest/Snigdho48.LLMCLI.yaml
            packaging/winget/manifest/Snigdho48.LLMCLI.locale.en-US.yaml
            packaging/winget/manifest/Snigdho48.LLMCLI.installer.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
